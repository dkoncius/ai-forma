<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelių žingsnių forma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .step-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .step-hidden {
            opacity: 0;
            transform: translateX(10px);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }
        .step-visible {
            opacity: 1;
            transform: translateX(0);
            position: relative;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <a href="statistika.html" target="_blank" rel="noopener noreferrer" class="fixed top-4 right-4 z-10 text-sm font-medium text-indigo-600 hover:text-indigo-800 bg-white/90 backdrop-blur px-4 py-2 rounded-lg shadow border border-gray-200 transition-colors">
        Diagramos
    </a>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden relative">
        
        <!-- Progress Bar Background -->
        <div class="h-2 w-full bg-gray-100">
            <!-- Progress Bar Fill -->
            <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-500 ease-out" style="width: 33.33%;"></div>
        </div>

        <div class="p-8">
            <div class="mb-8">
                <p id="stepIndicator" class="text-sm font-semibold text-indigo-600 tracking-wide uppercase mb-1">1 Žingsnis iš 3</p>
                <h2 id="stepTitle" class="text-2xl font-bold text-gray-900">Pasirinkite paslaugą</h2>
            </div>

            <form id="multiStepForm" class="relative">
                
                <!-- ŽINGSNIS 1 -->
                <div class="form-step step-visible" data-step="0">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <!-- Option 1 -->
                        <div>
                            <input type="radio" id="service-design" name="service" value="design" class="peer hidden" checked>
                            <label for="service-design" class="block w-full text-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700">
                                <svg class="w-8 h-8 mx-auto mb-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                                <span class="font-medium">Dizainas</span>
                            </label>
                        </div>
                        <!-- Option 2 -->
                        <div>
                            <input type="radio" id="service-dev" name="service" value="development" class="peer hidden">
                            <label for="service-dev" class="block w-full text-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700">
                                <svg class="w-8 h-8 mx-auto mb-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                                <span class="font-medium">Kodavimas</span>
                            </label>
                        </div>
                        <!-- Option 3 -->
                        <div>
                            <input type="radio" id="service-marketing" name="service" value="marketing" class="peer hidden">
                            <label for="service-marketing" class="block w-full text-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700">
                                <svg class="w-8 h-8 mx-auto mb-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                                <span class="font-medium">Rinkodara</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- ŽINGSNIS 2 -->
                <div class="form-step step-hidden" data-step="1">
                    <div class="flex flex-col gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="budget" value="small" class="peer hidden" checked>
                            <div class="p-4 border-2 border-gray-200 rounded-xl transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:shadow-sm flex items-center justify-between">
                                <span class="font-medium text-gray-900">Bazinė apimtis</span>
                                <span class="text-indigo-600 font-bold">Iki 1000 €</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="budget" value="medium" class="peer hidden">
                            <div class="p-4 border-2 border-gray-200 rounded-xl transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:shadow-sm flex items-center justify-between">
                                <span class="font-medium text-gray-900">Standartinė apimtis</span>
                                <span class="text-indigo-600 font-bold">1000 € - 5000 €</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="budget" value="large" class="peer hidden">
                            <div class="p-4 border-2 border-gray-200 rounded-xl transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:shadow-sm flex items-center justify-between">
                                <span class="font-medium text-gray-900">Plati apimtis</span>
                                <span class="text-indigo-600 font-bold">Virš 5000 €</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- ŽINGSNIS 3 -->
                <div class="form-step step-hidden" data-step="2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="deadline" value="urgent" class="peer hidden" checked>
                            <div class="p-5 border-2 border-gray-200 rounded-xl transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 text-center">
                                <div class="text-lg font-bold text-gray-900 mb-1">Skubu</div>
                                <div class="text-sm text-gray-500">Iki 2 savaičių</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="deadline" value="normal" class="peer hidden">
                            <div class="p-5 border-2 border-gray-200 rounded-xl transition-all hover:border-indigo-200 hover:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 text-center">
                                <div class="text-lg font-bold text-gray-900 mb-1">Lankstus</div>
                                <div class="text-sm text-gray-500">1 - 3 mėnesiai</div>
                            </div>
                        </label>
                    </div>
                    
                    <div class="mt-6">
                        <label for="comments" class="block text-sm font-medium text-gray-700 mb-2">Papildomi komentarai (neprivaloma)</label>
                        <textarea id="comments" name="comments" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none" placeholder="Trumpai apibūdinkite savo lūkesčius..."></textarea>
                    </div>
                </div>

                <!-- Navigacijos mygtukai -->
                <div class="mt-8 flex items-center justify-between pt-6 border-t border-gray-100">
                    <button type="button" id="btnBack" class="px-6 py-2.5 rounded-lg text-gray-600 font-medium hover:bg-gray-100 transition-colors invisible">
                        Atgal
                    </button>
                    
                    <button type="button" id="btnNext" class="px-6 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 shadow-md shadow-indigo-200 transition-all active:scale-95">
                        Toliau
                    </button>
                    
                    <button type="submit" id="btnSubmit" class="hidden px-6 py-2.5 rounded-lg bg-emerald-500 text-white font-medium hover:bg-emerald-600 shadow-md shadow-emerald-200 transition-all active:scale-95">
                        Siųsti užklausą
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sėkmės pranešimo modalas (Custom Alert) -->
    <div id="successModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-90 transition-transform duration-300" id="modalContent">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 mb-2">Pavyko!</h3>
            <p class="text-gray-600 mb-6">Jūsų užklausa sėkmingai išsiųsta. Susisieksime su jumis netrukus.</p>
            <button id="closeModal" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition-colors">
                Supratau
            </button>
        </div>
    </div>

    <script>
        const N8N_WEBHOOK_URL = 'https://baikas6.app.n8n.cloud/webhook/c02d37d9-af69-4a98-8401-553be2e2e340';
        const LOCAL_STATS_KEY = 'ai-forma-local-stats-v1';

        function appendLocalStatsEntry(entry) {
            try {
                const prev = JSON.parse(localStorage.getItem(LOCAL_STATS_KEY) || '[]');
                if (!Array.isArray(prev)) return;
                prev.push(entry);
                localStorage.setItem(LOCAL_STATS_KEY, JSON.stringify(prev));
            } catch (_) {
                /* ignore */
            }
        }

        /** Reikšmės pagal Google Sheet stulpelių pavadinimus (n8n mapping) */
        const SERVICE_LABELS = {
            design: 'Dizainas',
            development: 'Kodavimas',
            marketing: 'Rinkodara',
        };
        const BUDGET_LABELS = {
            small: 'Bazinė apimtis (iki 1000 €)',
            medium: 'Standartinė apimtis (1000 € - 5000 €)',
            large: 'Plati apimtis (virš 5000 €)',
        };
        const DEADLINE_LABELS = {
            urgent: 'Skubu (iki 2 savaičių)',
            normal: 'Lankstus (1 - 3 mėnesiai)',
        };

        /** Raktais sutampa su n8n išraiškomis: {{ $json.body.paslauga }} ir t. t. */
        function payloadForSheet(raw) {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            return {
                paslauga: SERVICE_LABELS[raw.service] ?? raw.service ?? '',
                biudzetas: BUDGET_LABELS[raw.budget] ?? raw.budget ?? '',
                terminas: DEADLINE_LABELS[raw.deadline] ?? raw.deadline ?? '',
                komentaras: (raw.comments ?? '').trim(),
                data: `${y}-${m}-${d}`,
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('.form-step');
            const btnNext = document.getElementById('btnNext');
            const btnBack = document.getElementById('btnBack');
            const btnSubmit = document.getElementById('btnSubmit');
            const progressBar = document.getElementById('progressBar');
            const stepIndicator = document.getElementById('stepIndicator');
            const stepTitle = document.getElementById('stepTitle');
            const form = document.getElementById('multiStepForm');
            const successModal = document.getElementById('successModal');
            const modalContent = document.getElementById('modalContent');
            const closeModal = document.getElementById('closeModal');
            const btnSubmitDefaultText = btnSubmit.textContent;

            const titles = [
                "Pasirinkite paslaugą",
                "Nustatykite biudžetą",
                "Pasirinkite terminą"
            ];

            let currentStep = 0;
            const totalSteps = steps.length;

            function updateUI() {
                // Update Steps Visibility with animation
                steps.forEach((step, index) => {
                    if (index === currentStep) {
                        step.classList.remove('step-hidden');
                        step.classList.add('step-visible', 'step-transition');
                    } else {
                        step.classList.remove('step-visible');
                        step.classList.add('step-hidden', 'step-transition');
                    }
                });

                // Update Progress Bar
                const progress = ((currentStep + 1) / totalSteps) * 100;
                progressBar.style.width = `${progress}%`;

                // Update Text
                stepIndicator.textContent = `${currentStep + 1} Žingsnis iš ${totalSteps}`;
                stepTitle.textContent = titles[currentStep];

                // Update Buttons
                if (currentStep === 0) {
                    btnBack.classList.add('invisible');
                } else {
                    btnBack.classList.remove('invisible');
                }

                if (currentStep === totalSteps - 1) {
                    btnNext.classList.add('hidden');
                    btnSubmit.classList.remove('hidden');
                } else {
                    btnNext.classList.remove('hidden');
                    btnSubmit.classList.add('hidden');
                }
            }

            btnNext.addEventListener('click', () => {
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    updateUI();
                }
            });

            btnBack.addEventListener('click', () => {
                if (currentStep > 0) {
                    currentStep--;
                    updateUI();
                }
            });

            // Form Submit Logic — siunčia JSON į n8n webhook
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const formData = new FormData(form);
                const raw = Object.fromEntries(formData.entries());
                const data = payloadForSheet(raw);

                btnSubmit.disabled = true;
                btnNext.disabled = true;
                btnBack.disabled = true;
                btnSubmit.textContent = 'Siunčiama…';

                try {
                    const response = await fetch(N8N_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    appendLocalStatsEntry({
                        ...data,
                        service: raw.service,
                        budget: raw.budget,
                        deadline: raw.deadline,
                        submittedAt: new Date().toISOString(),
                    });

                    successModal.classList.remove('opacity-0', 'pointer-events-none');
                    modalContent.classList.remove('scale-90');
                    modalContent.classList.add('scale-100');
                } catch (err) {
                    console.error('Webhook klaida:', err);
                    alert('Nepavyko išsiųsti užklausos. Patikrinkite interneto ryšį ir bandykite dar kartą.');
                } finally {
                    btnSubmit.disabled = false;
                    btnNext.disabled = false;
                    btnBack.disabled = false;
                    btnSubmit.textContent = btnSubmitDefaultText;
                }
            });

            // Close Modal Logic
            closeModal.addEventListener('click', () => {
                successModal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('scale-90');
                modalContent.classList.remove('scale-100');
                
                // Reset Form
                setTimeout(() => {
                    form.reset();
                    currentStep = 0;
                    updateUI();
                }, 300); // Wait for modal animation to finish
            });

            // Initial Setup
            updateUI();
        });
    </script>
</body>
</html>
